name: One-off - remove mytracker, then deploy blakecards.it
on:
  push:
    branches: [claude/blakecards-ecommerce-site-4k2byq]
    paths: [".github/workflows/remove-mytracker.yml"]
concurrency: deploy-site
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq sshpass
      - name: Remove mytracker and deploy the site
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          sshpass -e ssh $SSH_OPTS "root@$VPS_HOST" "bash -s" < deploy/remove-mytracker.sh
          sshpass -e ssh $SSH_OPTS "root@$VPS_HOST" "rm -rf /tmp/blakecards-site"
          sshpass -e scp $SSH_OPTS -q -r site "root@$VPS_HOST:/tmp/blakecards-site"
          sshpass -e ssh $SSH_OPTS "root@$VPS_HOST" "bash -s" < deploy/site.sh
      - name: Check the site answers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          curl -fsS -o /dev/null -w "HTTP %{http_code} via IP\n" -H "Host: www.blakecards.it" "http://$VPS_HOST/"
