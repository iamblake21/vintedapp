name: Vinted API smoke test
on:
  push:
    paths: ["scripts/*.py", "vinted_alerts/client.py", ".github/workflows/smoke-test.yml"]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe.py
      - run: python scripts/smoke_test.py
