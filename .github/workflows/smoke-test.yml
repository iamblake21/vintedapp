name: Vinted API smoke test
on:
  push:
    paths: ["scripts/*.py", "vinted_alerts/**", "tests/**", "deploy/**", ".github/workflows/smoke-test.yml"]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytest
      - run: python -m pytest -q
      - run: python scripts/smoke_test.py
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash deploy/install.sh
      - run: systemctl cat vinted-alerts
      - name: Service starts and scans
        run: |
          sudo systemctl start vinted-alerts
          sleep 25
          systemctl is-active vinted-alerts
          sudo journalctl -u vinted-alerts --no-pager | tail -20
          sudo journalctl -u vinted-alerts --no-pager | grep -q "mediana iniziale"
